name: flutter_studio
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  path: ^1.9.1
  file_picker: ^11.0.2
  permission_handler: ^12.0.1
  vector_math: ^2.2.0
  flutter_colorpicker: ^1.1.0
  web_socket_channel: ^3.0.3
  re_highlight: ^0.0.3
  markdown_widget: ^2.3.2+8
  flutter_inappwebview: ^6.1.5
  mime: ^2.0.0
  flutter_riverpod: ^3.3.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
  
  assets:
    - assets/action_icons/run.png
    - assets/action_icons/stop.png
    - assets/action_icons/hot_reload.png
    - assets/action_icons/hot_restart.png
    - assets/action_icons/debug.png
    - assets/action_icons/sync.png
    - assets/action_icons/format.png
    - assets/language_icons/lang_c.png
    - assets/language_icons/lang_cpp.png
    - assets/language_icons/dart-original.png
    - assets/language_icons/lang_html.png
    - assets/language_icons/lang_javascript.png
    - assets/language_icons/lang_python.png
    - assets/language_icons/lang_typescript.png
    - assets/language_icons/flutter-original.png

  fonts:
    - family: Method
      fonts:
        - asset: assets/icons/method.ttf
    - family: Variable
      fonts:
        - asset: assets/icons/variable.ttf
    - family: Class
      fonts:
        - asset: assets/icons/class.ttf
    - family: Reference
      fonts:
        - asset: assets/icons/reference.ttf
    - family: Struct
      fonts:
        - asset: assets/icons/struct.ttf
    - family: Event
      fonts:
        - asset: assets/icons/event.ttf
    - family: Operator
      fonts:
        - asset: assets/icons/operator.ttf
    - family: Parameter
      fonts:
        - asset: assets/icons/parameter.ttf
    - family: Interface
      fonts:
        - asset: assets/icons/interface.ttf
    - family: Field
      fonts:
        - asset: assets/icons/field.ttf
